[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xrp-forecast-prophet"
version = "0.1.0"
description = "XRP cryptocurrency price forecasting using Prophet"
readme = "README.md"
authors = [
    {name = "Your Name", email = "your@email.com"}
]
license = {text = "MIT"}
dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "prophet>=1.1.0",
    "statsmodels>=0.13.0"
]
[project.urls]
Repository = "https://github.com/YOUR_USERNAME/xrp-forecast"

[tool.setuptools.packages.find]
where = ["src"]
